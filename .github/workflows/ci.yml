name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Install Chromium for Windows smoke test
        if: runner.os == 'Windows'
        run: node packages/cli/dist/cli.js browsers install chromium
      - name: Windows browser smoke test
        if: runner.os == 'Windows'
        env:
          SEDUM_BROWSER_INTEGRATION: "1"
        run: pnpm exec vitest run packages/core/src/browser-driver.integration.test.ts

  required:
    name: CI
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Verify all matrix jobs passed
        run: test "${{ needs.checks.result }}" = success
