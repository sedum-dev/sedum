name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 24

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Dry-run npm package set
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/release/candidate.mjs --dry-run && node scripts/release/smoke-candidate.mjs release-candidate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

      - name: Install Chromium and Linux dependencies
        if: matrix.node == 24 && runner.os == 'Linux'
        run: node packages/cli/dist/cli.js browsers install chromium --with-deps
      - name: Install Chromium for engine tests
        if: matrix.node == 24 && runner.os != 'Linux'
        run: node packages/cli/dist/cli.js browsers install chromium
      - name: Keyless browser and provider engine tests
        if: matrix.node == 24
        run: pnpm fixtures:verify
      - name: Browser integration tests
        if: matrix.node == 24
        env:
          SEDUM_BROWSER_INTEGRATION: "1"
        run: pnpm exec vitest run packages/core/src/browser-driver.integration.test.ts packages/core/src/page-script.integration.test.ts packages/core/src/step-executor.integration.test.ts packages/core/src/assertion-engine.integration.test.ts

  required:
    name: CI
    runs-on: ubuntu-latest
    needs: checks
    if: always()
    steps:
      - name: Verify all matrix jobs passed
        run: test "${{ needs.checks.result }}" = success
