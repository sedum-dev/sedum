name: Recover partial npm alpha

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Original release candidate run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      manifest_sha256: ${{ steps.guard.outputs.manifest_sha256 }}
      source_commit: ${{ steps.guard.outputs.source_commit }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify partial release candidate
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          node scripts/release/verify-alpha-candidate.mjs > release-evidence.json
          jq -e '.recovery.published > 0 and .recovery.missing > 0' release-evidence.json
          jq -r '"manifest_sha256=" + .manifestSha256, "source_commit=" + .sourceCommit, "version=" + .version' release-evidence.json >> "$GITHUB_OUTPUT"
          cat release-evidence.json

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify partial release again after approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          node scripts/release/verify-alpha-candidate.mjs > release-evidence.json
          jq -e '.recovery.published > 0 and .recovery.missing > 0' release-evidence.json
          cat release-evidence.json
      - name: Download approved candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ inputs.candidate_run_id }}" --repo sedum-dev/sedum --name npm-candidate --dir release-candidate
      - name: Verify downloaded tarballs
        run: node scripts/release/verify-candidate.mjs release-candidate "${{ needs.preflight.outputs.manifest_sha256 }}"
      - name: Configure required recovery token
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.BOOTSTRAP_NPM_TOKEN }}
        run: |
          test -n "$BOOTSTRAP_NPM_TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$BOOTSTRAP_NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
      - name: Publish exact missing tarballs without provenance
        env:
          CANDIDATE_SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          MANIFEST_SHA256: ${{ needs.preflight.outputs.manifest_sha256 }}
          RECOVERY_PUBLISH: "true"
        run: node scripts/release/publish.mjs
      - name: Create GitHub release from Changesets changelogs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release/notes.mjs "${{ needs.preflight.outputs.version }}"
          gh release create "sedum-cli@${{ needs.preflight.outputs.version }}" --target "${{ needs.preflight.outputs.source_commit }}" --title "Sedum ${{ needs.preflight.outputs.version }}" --notes-file release-notes.md --prerelease

  install:
    needs: [preflight, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Clean public install and CLI smoke test
        shell: bash
        run: |
          mkdir clean-install
          cd clean-install
          npm init -y
          for attempt in {1..12}; do
            if npm install --ignore-scripts --prefer-online "sedum-cli@${{ needs.preflight.outputs.version }}" > install.log 2>&1; then
              cat install.log
              break
            fi
            cat install.log
            if ! grep -q 'npm error code E404' install.log || [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            echo "Published package metadata is not yet available; retrying in 10 seconds ($attempt/12)"
            sleep 10
          done
          npx --no-install sedum --version
