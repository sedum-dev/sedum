name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    env:
      RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
    steps:
      - name: Check release PR credentials
        run: test -n "$RELEASE_PR_TOKEN" || { echo 'RELEASE_PR_TOKEN is required because the organization disables GitHub Actions PR creation'; exit 1; }
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
