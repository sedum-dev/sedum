<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create your account · Nimbus</title>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        color: #1d2330;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 1.5rem;
        border-bottom: 1px solid #ddd;
      }
      .top a {
        color: #1d2330;
        text-decoration: none;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 700;
        font-size: 1.1rem;
      }
      main {
        max-width: 400px;
        margin: 2rem auto;
      }
      .google {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #bbb;
        background: #fff;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        font: inherit;
        cursor: pointer;
      }
      .or {
        text-align: center;
        color: #777;
        margin: 1rem 0;
      }
      .field {
        margin: 0 0 0.9rem;
      }
      .field label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem;
        border: 1px solid #bbb;
        border-radius: 6px;
        font: inherit;
      }
      .pw {
        position: relative;
      }
      .eye {
        position: absolute;
        right: 0.3rem;
        top: 0.25rem;
        border: 0;
        background: none;
        font-size: 1.1rem;
        cursor: pointer;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 1rem;
      }
      .check {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0.4rem 0;
      }
      .primary {
        width: 100%;
        padding: 0.65rem;
        background: #2f5bea;
        color: #fff;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .foot {
        text-align: center;
        margin-top: 1rem;
      }
      ui-button {
        display: block;
      }
      .checks {
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <ui-link href="/" variant="brand" gold-key="logo">Nimbus</ui-link>
      <nav><ui-link href="/help" gold-key="help">Help</ui-link></nav>
    </header>
    <main>
      <h1>Create your account</h1>
      <ui-button variant="outlined" icon="google" gold-key="google"
        >Continue with Google</ui-button
      >
      <p class="or">or</p>
      <form id="signup" action="/signup" method="post">
        <ui-text-field
          label="Full name"
          name="name"
          gold-key="name"
        ></ui-text-field>
        <ui-text-field
          label="Email"
          name="email"
          type="email"
          gold-key="email"
        ></ui-text-field>
        <ui-text-field
          label="Confirm email"
          name="email_confirm"
          type="email"
          gold-key="email2"
        ></ui-text-field>
        <ui-text-field
          label="Password"
          name="password"
          type="password"
          gold-key="password"
          reveal
        ></ui-text-field>
        <div class="checks">
          <ui-checkbox name="terms" gold-key="terms"
            >I agree to the Terms</ui-checkbox
          >
          <ui-checkbox name="news" gold-key="news"
            >Send me product news</ui-checkbox
          >
        </div>
        <ui-button variant="primary" type="submit" gold-key="create"
          >Create account</ui-button
        >
      </form>
      <p class="foot">
        Already have an account?
        <ui-link href="/login" gold-key="login">Log in</ui-link>
      </p>
    </main>
    <script>
      // Evaluation labels for the real controls inside each shadow root.
      const GOLD = {
        logo: 'data-eval-gold="logo"',
        help: 'data-eval-gold="help"',
        google: 'data-eval-gold="google"',
        name: 'data-eval-gold="name"',
        email: 'data-eval-gold="email"',
        email2: 'data-eval-gold="email2"',
        password: 'data-eval-gold="password"',
        "show-password": 'data-eval-gold="show-password"',
        terms: 'data-eval-gold="terms"',
        news: 'data-eval-gold="news"',
        create: 'data-eval-gold="create"',
        login: 'data-eval-gold="login"',
      };
      const gold = (key) => GOLD[key] ?? "";
      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const ICONS = {
        google:
          '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#ea4335"/></svg>',
        brand:
          '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="#2f5bea"/></svg>',
      };

      customElements.define(
        "ui-link",
        class extends HTMLElement {
          connectedCallback() {
            if (this.shadowRoot) return;
            const brand = this.getAttribute("variant") === "brand";
            this.attachShadow({ mode: "open" }).innerHTML = `<style>
              a { color: ${brand ? "#1d2330" : "#0645ad"}; text-decoration: ${brand ? "none" : "underline"}; display: inline-flex; align-items: center; gap: .4rem; }
              :host([variant="brand"]) a { font-weight: 700; font-size: 1.1rem; }
              :host(:not([variant])) a { color: inherit; }
              </style><a part="anchor" href="${esc(this.getAttribute("href"))}" ${gold(this.getAttribute("gold-key"))}>${brand ? ICONS.brand : ""}<slot></slot></a>`;
            if (!brand && this.closest(".foot"))
              this.shadowRoot.querySelector("a").style.color = "#0645ad";
          }
        },
      );

      customElements.define(
        "ui-button",
        class extends HTMLElement {
          connectedCallback() {
            if (this.shadowRoot) return;
            const primary = this.getAttribute("variant") === "primary";
            const icon = ICONS[this.getAttribute("icon")] ?? "";
            this.attachShadow({ mode: "open" }).innerHTML = `<style>
              :host { display: block; }
              button { width: 100%; padding: ${primary ? ".65rem" : ".6rem"}; border-radius: 6px; font: inherit; cursor: pointer;
                display: flex; justify-content: center; gap: .5rem;
                ${primary ? "background:#2f5bea;color:#fff;border:0;font-weight:600;" : "background:#fff;border:1px solid #bbb;"} }
              </style><button part="control" type="button" ${gold(this.getAttribute("gold-key"))}>${icon}<slot></slot></button>`;
            if (this.getAttribute("type") === "submit")
              this.shadowRoot
                .querySelector("button")
                .addEventListener("click", () =>
                  this.closest("form")?.requestSubmit(),
                );
          }
        },
      );

      customElements.define(
        "ui-text-field",
        class extends HTMLElement {
          connectedCallback() {
            if (this.shadowRoot) return;
            const reveal = this.hasAttribute("reveal");
            const key = this.getAttribute("gold-key");
            this.attachShadow({ mode: "open" }).innerHTML = `<style>
              :host { display: block; margin: 0 0 .9rem; }
              label { display: block; font-size: .85rem; margin-bottom: .25rem; }
              .wrap { position: relative; }
              input { width: 100%; box-sizing: border-box; padding: .5rem; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
              .eye { position: absolute; right: .3rem; top: .25rem; border: 0; background: none; font-size: 1.1rem; cursor: pointer; }
              </style><label for="control">${esc(this.getAttribute("label"))}</label><div class="wrap"><input id="control" name="${esc(this.getAttribute("name"))}" type="${esc(this.getAttribute("type") || "text")}" ${gold(key)}>${
                reveal
                  ? `<button class="eye" type="button" aria-label="Show password" ${gold("show-password")}>👁</button>`
                  : ""
              }</div>`;
            if (reveal) {
              const input = this.shadowRoot.getElementById("control");
              this.shadowRoot
                .querySelector(".eye")
                .addEventListener("click", () => {
                  input.type = input.type === "password" ? "text" : "password";
                });
            }
          }
        },
      );

      customElements.define(
        "ui-checkbox",
        class extends HTMLElement {
          connectedCallback() {
            if (this.shadowRoot) return;
            this.attachShadow({ mode: "open" }).innerHTML = `<style>
              :host { display: block; margin: .4rem 0; }
              label { display: flex; gap: .5rem; align-items: center; }
              </style><label><input type="checkbox" name="${esc(this.getAttribute("name"))}" ${gold(this.getAttribute("gold-key"))}><slot></slot></label>`;
          }
        },
      );

      document.getElementById("signup").addEventListener("submit", (event) => {
        event.preventDefault();
        fetch("/signup", { method: "POST" });
      });
    </script>
  </body>
</html>
