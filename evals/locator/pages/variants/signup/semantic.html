<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create your account · Nimbus</title>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        color: #1d2330;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 1.5rem;
        border-bottom: 1px solid #ddd;
      }
      .top a {
        color: #1d2330;
        text-decoration: none;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-weight: 700;
        font-size: 1.1rem;
      }
      main {
        max-width: 400px;
        margin: 2rem auto;
      }
      .google {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #bbb;
        background: #fff;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        font: inherit;
        cursor: pointer;
      }
      .or {
        text-align: center;
        color: #777;
        margin: 1rem 0;
      }
      .field {
        margin: 0 0 0.9rem;
      }
      .field label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 0.25rem;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem;
        border: 1px solid #bbb;
        border-radius: 6px;
        font: inherit;
      }
      .pw {
        position: relative;
      }
      .eye {
        position: absolute;
        right: 0.3rem;
        top: 0.25rem;
        border: 0;
        background: none;
        font-size: 1.1rem;
        cursor: pointer;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0 0 1rem;
      }
      .check {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin: 0.4rem 0;
      }
      .primary {
        width: 100%;
        padding: 0.65rem;
        background: #2f5bea;
        color: #fff;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .foot {
        text-align: center;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/" data-eval-gold="logo"
        ><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <circle cx="11" cy="11" r="10" fill="#2f5bea" /></svg
        >Nimbus</a
      >
      <nav aria-label="Support">
        <a href="/help" data-eval-gold="help">Help</a>
      </nav>
    </header>
    <main>
      <h1>Create your account</h1>
      <button type="button" class="google" data-eval-gold="google">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="8" fill="#ea4335" /></svg
        >Continue with Google
      </button>
      <p class="or">or</p>
      <form action="/signup" method="post">
        <div class="field">
          <label for="full-name">Full name</label>
          <input
            id="full-name"
            name="name"
            autocomplete="name"
            data-eval-gold="name"
          />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            data-eval-gold="email"
          />
        </div>
        <div class="field">
          <label for="email-confirm">Confirm email</label>
          <input
            id="email-confirm"
            name="email_confirm"
            type="email"
            data-eval-gold="email2"
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              data-eval-gold="password"
            />
            <button
              type="button"
              class="eye"
              aria-label="Show password"
              aria-pressed="false"
              data-eval-gold="show-password"
            >
              👁
            </button>
          </div>
        </div>
        <fieldset>
          <div class="check">
            <input
              id="terms"
              name="terms"
              type="checkbox"
              data-eval-gold="terms"
            />
            <label for="terms">I agree to the Terms</label>
          </div>
          <div class="check">
            <input
              id="news"
              name="news"
              type="checkbox"
              data-eval-gold="news"
            />
            <label for="news">Send me product news</label>
          </div>
        </fieldset>
        <button type="submit" class="primary" data-eval-gold="create">
          Create account
        </button>
      </form>
      <p class="foot">
        Already have an account?
        <a href="/login" data-eval-gold="login">Log in</a>
      </p>
    </main>
    <script>
      const pw = document.getElementById("password");
      document.querySelector(".eye").addEventListener("click", (event) => {
        const shown = pw.type === "text";
        pw.type = shown ? "password" : "text";
        event.currentTarget.setAttribute("aria-pressed", String(!shown));
      });
    </script>
  </body>
</html>
