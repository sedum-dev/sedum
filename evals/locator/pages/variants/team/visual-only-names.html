<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Team members</title>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        background: #f5f6f8;
        color: #1d2330;
      }
      main {
        max-width: 860px;
        margin: 1.5rem auto;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .toolbar input {
        font: inherit;
        padding: 0.4rem 0.6rem;
        border: 1px solid #b8bec9;
        border-radius: 6px;
        width: 260px;
        margin-right: auto;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .primary {
        background: #3060d0;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 0.45rem 0.9rem;
      }
      .secondary {
        background: #fff;
        border: 1px solid #b8bec9;
        border-radius: 6px;
        padding: 0.45rem 0.9rem;
      }
      .secondary:disabled {
        color: #9aa0ab;
        border-color: #dde1e8;
        cursor: default;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border: 1px solid #dde1e8;
      }
      th,
      td {
        padding: 0.5rem 0.75rem;
        text-align: left;
        border-bottom: 1px solid #eef0f3;
      }
      th {
        font-weight: 600;
        background: #fafbfc;
      }
      .col-check {
        width: 110px;
      }
      .row-actions {
        display: flex;
        gap: 0.4rem;
        justify-content: flex-end;
      }
      .edit {
        background: #fff;
        border: 1px solid #b8bec9;
        border-radius: 4px;
        padding: 0.2rem 0.7rem;
      }
      .icon-btn {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: none;
        display: grid;
        place-items: center;
      }
      .icon-btn:hover {
        background: #eef0f3;
      }
      .pager {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        align-items: center;
        margin-top: 0.75rem;
      }
      .pager a {
        color: #3060d0;
      }
      /* Label supplied by the stylesheet (translated per locale via CSS). */
      .pager-next::before {
        content: "Next";
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Team members</h1>
      <div class="toolbar">
        <input
          type="search"
          name="q"
          placeholder="Search members"
          data-eval-gold="search"
        />
        <button
          type="button"
          class="secondary"
          disabled
          data-eval-gold="remove-selected"
        >
          Remove selected
        </button>
        <button type="button" class="primary" data-eval-gold="invite">
          Invite member
        </button>
      </div>
      <table>
        <thead>
          <tr>
            <th class="col-check">
              <input type="checkbox" data-eval-gold="select-all" />
              <span>Select all</span>
            </th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="checkbox" data-eval-gold="select-ada" /></td>
            <td>Ada Lovelace</td>
            <td>ada@example.com</td>
            <td>Owner</td>
            <td>
              <div class="row-actions">
                <button type="button" class="edit" data-eval-gold="edit-ada">
                  Edit
                </button>
                <button
                  type="button"
                  class="icon-btn"
                  data-eval-gold="more-ada"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="19" r="2" />
                  </svg>
                  <span class="sr-only">More</span>
                </button>
              </div>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" data-eval-gold="select-grace" /></td>
            <td>Grace Hopper</td>
            <td>grace@example.com</td>
            <td>Admin</td>
            <td>
              <div class="row-actions">
                <button type="button" class="edit" data-eval-gold="edit-grace">
                  Edit
                </button>
                <button
                  type="button"
                  class="icon-btn"
                  data-eval-gold="more-grace"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="19" r="2" />
                  </svg>
                  <span class="sr-only">More</span>
                </button>
              </div>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" data-eval-gold="select-alan" /></td>
            <td>Alan Turing</td>
            <td>alan@example.com</td>
            <td>Member</td>
            <td>
              <div class="row-actions">
                <button type="button" class="edit" data-eval-gold="edit-alan">
                  Edit
                </button>
                <button
                  type="button"
                  class="icon-btn"
                  data-eval-gold="more-alan"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="19" r="2" />
                  </svg>
                  <span class="sr-only">More</span>
                </button>
              </div>
            </td>
          </tr>
          <tr>
            <td><input type="checkbox" data-eval-gold="select-katherine" /></td>
            <td>Katherine Johnson</td>
            <td>katherine@example.com</td>
            <td>Member</td>
            <td>
              <div class="row-actions">
                <button
                  type="button"
                  class="edit"
                  data-eval-gold="edit-katherine"
                >
                  Edit
                </button>
                <button
                  type="button"
                  class="icon-btn"
                  data-eval-gold="more-katherine"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="5" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="19" r="2" />
                  </svg>
                  <span class="sr-only">More</span>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="pager">
        <a href="?page=1" data-eval-gold="prev">Previous</a>
        <span>Page 2 of 3</span>
        <a href="?page=3" class="pager-next" data-eval-gold="next"></a>
      </div>
    </main>
  </body>
</html>
