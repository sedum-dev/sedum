<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account settings</title>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        background: #f5f6f8;
        color: #1d2330;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.6rem 1.25rem;
        background: #1d2330;
      }
      .logo {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 0;
        background: #39414f;
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      main {
        max-width: 720px;
        margin: 1.5rem auto;
      }
      [role="tablist"] {
        display: flex;
        gap: 0.25rem;
        border-bottom: 1px solid #d0d4dc;
      }
      [role="tab"] {
        font: inherit;
        border: 0;
        background: none;
        padding: 0.6rem 1rem;
        cursor: pointer;
      }
      [role="tab"][aria-selected="true"] {
        border-bottom: 2px solid #3060d0;
        font-weight: 600;
      }
      .card {
        background: #fff;
        border: 1px solid #dde1e8;
        border-radius: 8px;
        padding: 1rem 1.25rem;
        margin: 1rem 0;
      }
      .card h2 {
        font-size: 1.1rem;
        margin: 0 0 0.75rem;
      }
      .switch-row,
      .field-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid #f0f1f4;
      }
      input[role="switch"] {
        appearance: none;
        width: 40px;
        height: 22px;
        border-radius: 11px;
        background: #c5cad3;
        position: relative;
        margin: 0;
        cursor: pointer;
      }
      input[role="switch"]::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
      }
      input[role="switch"]:checked {
        background: #3060d0;
      }
      input[role="switch"]:checked::after {
        left: 20px;
      }
      select {
        font: inherit;
        padding: 0.3rem 0.5rem;
        min-width: 140px;
      }
      .actions {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-top: 1rem;
      }
      .primary {
        font: inherit;
        background: #3060d0;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      .actions a {
        color: #3060d0;
      }
      .danger {
        border-color: #e0a0a0;
      }
      .danger button {
        font: inherit;
        color: #b02020;
        background: #fff;
        border: 1px solid #b02020;
        border-radius: 6px;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="logo" data-eval-gold="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 20V4l16 16V4"
            stroke="currentColor"
            stroke-width="3"
            fill="none"
          />
        </svg>
        <span>Northwind</span>
      </a>
      <button
        type="button"
        class="icon-btn"
        aria-label="Account menu"
        aria-haspopup="menu"
        aria-expanded="false"
        data-eval-gold="account-menu"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="currentColor" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6z" fill="currentColor" />
        </svg>
      </button>
    </header>
    <main>
      <h1>Account settings</h1>
      <div role="tablist" aria-label="Settings sections">
        <button
          type="button"
          role="tab"
          id="tab-profile"
          aria-selected="false"
          aria-controls="panel-profile"
          tabindex="-1"
          data-eval-gold="tab-profile"
        >
          Profile
        </button>
        <button
          type="button"
          role="tab"
          id="tab-notifications"
          aria-selected="true"
          aria-controls="panel-notifications"
          data-eval-gold="tab-notifications"
        >
          Notifications
        </button>
        <button
          type="button"
          role="tab"
          id="tab-security"
          aria-selected="false"
          aria-controls="panel-security"
          tabindex="-1"
          data-eval-gold="tab-security"
        >
          Security
        </button>
      </div>

      <form
        id="panel-notifications"
        role="tabpanel"
        aria-labelledby="tab-notifications"
        class="card"
        action="/settings/notifications"
        method="post"
      >
        <h2>Notifications</h2>
        <div class="switch-row">
          <label for="sw-email">Email alerts</label>
          <input
            type="checkbox"
            role="switch"
            id="sw-email"
            name="email_alerts"
            checked
            data-eval-gold="sw-email"
          />
        </div>
        <div class="switch-row">
          <label for="sw-push">Push notifications</label>
          <input
            type="checkbox"
            role="switch"
            id="sw-push"
            name="push"
            data-eval-gold="sw-push"
          />
        </div>
        <div class="switch-row">
          <label for="sw-digest">Weekly digest</label>
          <input
            type="checkbox"
            role="switch"
            id="sw-digest"
            name="digest"
            checked
            data-eval-gold="sw-digest"
          />
        </div>
        <div class="field-row">
          <label for="digest-day">Digest day</label>
          <select id="digest-day" name="digest_day" data-eval-gold="digest-day">
            <option selected>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit" class="primary" data-eval-gold="save">
            Save changes
          </button>
          <a href="/settings" data-eval-gold="cancel">Cancel</a>
        </div>
      </form>

      <section class="card danger" aria-labelledby="h-danger">
        <h2 id="h-danger">Danger zone</h2>
        <p>Deactivating hides your profile until you sign in again.</p>
        <button type="button" data-eval-gold="deactivate">
          Deactivate account
        </button>
        <p>Deleting your account removes all your data permanently.</p>
        <button type="button" data-eval-gold="delete-account">
          Delete account
        </button>
      </section>
    </main>
  </body>
</html>
