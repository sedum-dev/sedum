<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marketly</title>
    <style>
      body {
        font: 15px system-ui;
        margin: 0;
        max-width: 420px;
        position: relative;
        min-height: 720px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0.75rem;
        background: #146;
        color: #fff;
      }
      header a,
      header button {
        color: #fff;
        background: none;
        border: 0;
        font-size: 20px;
      }
      .drawer {
        position: absolute;
        top: 0;
        left: 0;
        width: 260px;
        height: 100%;
        background: #fff;
        box-shadow: 2px 0 8px #0005;
        padding: 1rem;
        z-index: 5;
      }
      .drawer ul {
        list-style: none;
        padding: 0;
      }
      .drawer li {
        padding: 0.5rem 0;
      }
      main {
        padding: 0.75rem;
      }
      .card {
        border: 1px solid #ccc;
        padding: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .tabbar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-around;
        border-top: 1px solid #ccc;
        background: #fafafa;
        padding: 0.4rem 0;
      }
      .badge {
        background: #d22;
        color: #fff;
        border-radius: 999px;
        font-size: 11px;
        padding: 0 5px;
      }
      .fab {
        position: absolute;
        right: 1rem;
        bottom: 4rem;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 0;
        background: #e60;
        color: #fff;
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <header>
      <button
        aria-label="Open menu"
        aria-expanded="true"
        aria-controls="drawer"
        data-eval-gold="open-menu"
      >
        &#9776;
      </button>
      <a href="/" aria-label="Marketly home" data-eval-gold="logo">Marketly</a>
      <button aria-label="Search" data-eval-gold="header-search">
        &#128269;
      </button>
    </header>

    <nav class="drawer" id="drawer" aria-label="Menu">
      <button aria-label="Close menu" data-eval-gold="close-menu">
        &times;
      </button>
      <p>Hi, Rosa</p>
      <ul>
        <li><a href="/" data-eval-gold="drawer-home">Home</a></li>
        <li><a href="/shop" data-eval-gold="drawer-shop">Shop</a></li>
        <li><a href="/deals" data-eval-gold="drawer-deals">Deals</a></li>
        <li><a href="/orders" data-eval-gold="drawer-orders">Orders</a></li>
        <li><a href="/help" data-eval-gold="drawer-help">Help</a></li>
      </ul>
      <button data-eval-gold="sign-out">Sign out</button>
    </nav>

    <main>
      <h1>Near you</h1>
      <div class="card">
        <h3>Vintage desk lamp</h3>
        <p>$40 &middot; 2 km away</p>
        <a href="/item/881" data-eval-gold="view-lamp">View</a>
        <button aria-label="Save Vintage desk lamp" data-eval-gold="save-lamp">
          &#9825;
        </button>
      </div>
      <div class="card">
        <h3>Kids' bike, 20 inch</h3>
        <p>$75 &middot; 5 km away</p>
        <a href="/item/882" data-eval-gold="view-bike">View</a>
        <button
          aria-label="Save Kids' bike, 20 inch"
          data-eval-gold="save-bike"
        >
          &#9825;
        </button>
      </div>
    </main>

    <button class="fab" aria-label="Create listing" data-eval-gold="fab">
      +
    </button>

    <nav class="tabbar" aria-label="Tabs">
      <a href="/" aria-current="page" data-eval-gold="tab-home">Home</a>
      <a href="/search" data-eval-gold="tab-search">Search</a>
      <a href="/cart" aria-label="Cart, 2 items" data-eval-gold="tab-cart"
        >&#128722; <span class="badge">2</span></a
      >
      <a href="/profile" data-eval-gold="tab-profile">Profile</a>
    </nav>
  </body>
</html>
